<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farm Misteris</title>
<link rel="stylesheet" href="farm.css">
</head>
<body>

<div class="game-wrapper">
  <div class="game-title-large">FARM <span class="accent">MISTERIS</span></div>

  <div class="player-card">
    <div class="player-row">
      <div class="player-avatar">🌾<div class="level-badge" id="levelBadge">1</div></div>
      <div class="player-info">
        <div class="player-name">Фермер</div>
        <div class="xp-bar-wrap"><div class="xp-bar" id="xpBar" style="width: 0%"></div></div>
        <div class="xp-text"><span id="xpText">0 / 100 XP</span></div>
      </div>
    </div>
    <div class="currency-row">
      <div class="curr-item"><span class="icon">🪙</span><span class="val" id="coinDisplay">0</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="field"><span class="tab-icon">🌱</span><span>Грядки</span></button>
    <button class="tab-btn" data-tab="shop"><span class="tab-icon">🛒</span><span>Семена</span></button>
    <button class="tab-btn" data-tab="land"><span class="tab-icon">🗺️</span><span>Участки</span></button>
    <button class="tab-btn" data-tab="guide"><span class="tab-icon">📖</span><span>Гайд</span></button>
  </div>

  <div class="tab-content active" id="tab-field">
    <div class="farm-tabs" id="farmTabs"></div>
    <div class="board-container">
      <div class="farm-grid" id="farmGrid"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-shop">
    <div class="section">
      <div class="section-title">🛒 СЕМЕНА</div>
      <div id="shopList" class="shop-grid"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-land">
    <div class="section">
      <div class="section-title">🗺️ РАСШИРЕНИЕ ФЕРМЫ</div>
      <div id="landList" class="shop-grid"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-guide">
    <div class="section">
      <div class="section-title">📖 ГАЙДБУК</div>
      <div class="guide-text">
        <p>👋 <b>Добро пожаловать в Farm Misteris!</b></p>
        <p>🌱 Выбирай семена, сажай на грядки и собирай урожай. Трать монеты на новые участки!</p>
        <p>⏳ <b>Важно:</b> растения растут даже когда игра закрыта!</p>
      </div>
      
      <div class="section-title" style="margin-top: 20px;">🌾 СПРАВОЧНИК РАСТЕНИЙ</div>
      <div id="guideCropsList" class="shop-grid"></div>
    </div>
  </div>

  <div class="version-text">ВЕРСИЯ 0.4 — ГАЙД</div>
</div>

<script src="farm.js"></script>
</body>
</html>
